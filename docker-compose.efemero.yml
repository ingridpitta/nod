# definido em 2026-09-18: banco descartavel para desenvolver uma feature sem tocar no banco diario.
# O nome do projeto Compose isola o container; NOD_PG_PORT escolhe a porta no host.
services:
  postgres:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${NOD_PG_PORT:-5435}:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nod_dono -d nod"]
      interval: 2s
      timeout: 3s
      retries: 30
